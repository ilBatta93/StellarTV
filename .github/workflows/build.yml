name: StellarTV Android Release

on:
  # Build solo su richiesta (Run workflow o API)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Una sola build alla volta su tutti i branch: la successiva aspetta in coda,
# quella in corso non viene interrotta a metà rilascio.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Libera spazio sul disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
              /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
              /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google \
              /usr/lib/jvm/temurin-8* /usr/lib/jvm/temurin-11* || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versione e note di rilascio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Dalla build 169 si passa alla serie 3.9 (3.9.0, 3.9.1, ...)
          PATCH=$(( ${{ github.run_number }} - 169 ))
          VERSION="3.9.${PATCH}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 -m unittest discover -s scripts -p '*_test.py'
          python3 scripts/release_notes.py "$VERSION"

      - name: Chiave di firma dai secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          # Senza chiave la build si ferma: mai un APK firmato con la chiave di debug.
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret mancante per la firma: $v"; exit 1; fi
          done
          echo "$KEYSTORE_B64" | base64 -d > android/app/stellartv-release.jks
          printf 'storeFile=stellartv-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          keytool -list -keystore android/app/stellartv-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/settings.gradle', 'pubspec.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Flutter packages
        run: |
          set -e
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          rm -f ios/Runner/GeneratedPluginRegistrant.h ios/Runner/GeneratedPluginRegistrant.m
          flutter pub get

      - name: Verify foreground hibernation
        run: |
          dart run test/foreground_policy_check.dart
          dart run test/foreground_http_check.dart
          dart run test/tv_playback_shortcuts_check.dart
          dart run test/tv_render_policy_check.dart
          dart run test/live_preview_policy_check.dart

      - name: Esegui i test Dart
        run: flutter test

      - name: Verify native live window
        run: |
          set -e
          flutter build apk --config-only --debug --no-pub
          cd android
          ./gradlew :video_player_android:testReleaseUnitTest --tests 'io.flutter.plugins.videoplayer.VideoPlayerTest.frameHealthDoesNotConfuseDimensionsWithRenderedVideo' --tests 'io.flutter.plugins.videoplayer.VideoPlayerTest.liveSeekClampsToCurrentWindow' --tests 'io.flutter.plugins.videoplayer.VideoPlayerTest.unseekableLiveDoesNotSeek' --tests 'io.flutter.plugins.videoplayer.VideoPlayerTest.liveDefaultPositionUsesNativeDefault'

      - name: Build APK (Release)
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dorg.gradle.parallel=true
        run: |
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION="$VERSION"
          df -h /

      - name: Prepara APK per Release
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/StellarTV-v${{ env.VERSION }}.apk"

      - name: Carica Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: "StellarTV-v${{ env.VERSION }}"
          path: dist/*.apk
          retention-days: 5

      - name: Crea GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "StellarTV v${{ env.VERSION }}"
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: dist/*.apk
          draft: false
          prerelease: false

      - name: Pubblica su StellarTV-releases (pubblica)
        if: ${{ env.RELEASE_TOKEN != '' }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ilBatta93/StellarTV-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: "v${{ env.VERSION }}"
          name: "StellarTV v${{ env.VERSION }}"
          body_path: RELEASE_NOTES.md
          files: dist/*.apk
          draft: false
          prerelease: false

      - name: Pulizia artifact e release (ultime 5)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO=${{ github.repository }}
          # Artifact: tiene i 5 piu recenti, elimina gli altri (spazio Actions limitato).
          gh api "repos/$REPO/actions/artifacts?per_page=100" --paginate -q '.artifacts | sort_by(.created_at) | reverse | .[5:] | .[].id' | while read -r ID; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$ID" || true
          done
          # Release: tiene le 5 piu recenti; i tag restano per le note di rilascio.
          gh release list --repo "$REPO" --limit 200 --json tagName -q '.[5:] | .[].tagName' | while read -r TAG; do
            gh release delete "$TAG" --repo "$REPO" --yes || true
          done

      - name: Tieni solo l'ultima release pubblica
        if: ${{ env.RELEASE_TOKEN != '' }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -e
          REPO=ilBatta93/StellarTV-releases
          gh release list --repo "$REPO" --limit 200 --json tagName -q '.[].tagName' | while read -r TAG; do
            if [ "$TAG" != "v$VERSION" ]; then
              gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true
            fi
          done