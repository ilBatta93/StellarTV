name: StellarTV Android Release

on:
  # Build solo su richiesta (Run workflow o API)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Libera spazio sul disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
              /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
              /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google \
              /usr/lib/jvm/temurin-8* /usr/lib/jvm/temurin-11* || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versione e note di rilascio
        run: |
          set -e
          # Dalla build 25 si passa alla serie 3.2 (3.2.0, 3.2.1, ...)
          PATCH=$(( ${{ github.run_number }} - 25 ))
          VERSION="3.2.${PATCH}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git fetch --tags --force
          PREV=$(git tag --list 'v3.*' --sort=-v:refname | grep -vx "v$VERSION" | head -n1 || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD~30..HEAD"; fi
          {
            echo "## Novità dalla versione ${PREV:-precedente}"
            echo
            git log $RANGE --no-merges --reverse --format='### %s%n%n%b%n_commit `%h`_%n'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/settings.gradle', 'pubspec.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Flutter packages
        run: |
          set -e
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          rm -f ios/Runner/GeneratedPluginRegistrant.h ios/Runner/GeneratedPluginRegistrant.m
          flutter pub get

      - name: Verify Home and episode completion
        run: flutter test test/home_progress_rules_test.dart test/overlay_history_completion_test.dart test/horizontal_row_remote_test.dart test/home_banner_remote_test.dart test/sync_keys_test.dart

      - name: Build APK (Release)
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dorg.gradle.parallel=true
        run: |
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION="$VERSION"
          df -h /

      - name: Prepara APK per Release
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/StellarTV-v${{ env.VERSION }}.apk"

      - name: Carica Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: "StellarTV-v${{ env.VERSION }}"
          path: dist/*.apk
          retention-days: 14

      - name: Crea GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "StellarTV v${{ env.VERSION }}"
          body_path: RELEASE_NOTES.md
          files: dist/*.apk
          draft: false
          prerelease: false

      - name: Pubblica su StellarTV-releases (pubblica)
        if: ${{ env.RELEASE_TOKEN != '' }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ilBatta93/StellarTV-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: "v${{ env.VERSION }}"
          name: "StellarTV v${{ env.VERSION }}"
          body_path: RELEASE_NOTES.md
          files: dist/*.apk
          draft: false
          prerelease: false
