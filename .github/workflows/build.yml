name: StellarTV Android Release

on:
  # Build solo su richiesta (Run workflow o API)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Libera spazio sul disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
              /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
              /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google \
              /usr/lib/jvm/temurin-8* /usr/lib/jvm/temurin-11* || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versione e note di rilascio
        run: |
          set -e
          # Dalla build 65 si passa alla serie 3.6 (3.6.0, 3.6.1, ...)
          PATCH=$(( ${{ github.run_number }} - 65 ))
          VERSION="3.6.${PATCH}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git fetch --tags --force
          PREV=$(git tag --list 'v3.*' --sort=-v:refname | grep -vx "v$VERSION" | head -n1 || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD~30..HEAD"; fi
          {
            echo "## Novità dalla versione ${PREV:-precedente}"
            echo
            cat docs/release-playback-assistance.md
            echo
            git log $RANGE --reverse --format='- Miglioramenti al player multimediale · commit `%h`'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/settings.gradle', 'pubspec.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Flutter packages
        run: |
          set -e
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          rm -f ios/Runner/GeneratedPluginRegistrant.h ios/Runner/GeneratedPluginRegistrant.m
          flutter pub get

      - name: Verify foreground hibernation
        run: |
          dart run test/foreground_policy_check.dart
          dart run test/foreground_http_check.dart
          dart run test/tv_playback_shortcuts_check.dart

      - name: Verify Home and episode completion
        # Also exercise the shared watched/remaining-time policy.
        run: flutter test test/catalog_loading_test.dart test/episode_position_latest_test.dart test/auto_next_sync_test.dart test/manual_watch_persistence_test.dart test/playback_assistance_test.dart test/playback_work_policy_test.dart test/favorites_mutation_test.dart test/history_account_isolation_test.dart test/personal_vault_remote_test.dart test/personal_vault_test.dart test/personal_vault_diagnostics_test.dart test/brand_vector_test.dart test/live_diagnostics_test.dart test/live_diagnostics_remote_test.dart test/video_health_test.dart test/profile_startup_safety_test.dart test/home_progress_rules_test.dart test/overlay_history_completion_test.dart test/horizontal_row_remote_test.dart test/home_banner_remote_test.dart test/sync_keys_test.dart test/session_restore_test.dart test/title_logo_cache_test.dart test/pairing_presentation_test.dart test/home_logo_loading_test.dart test/discover_loading_test.dart test/xtream_catchup_test.dart test/playback_session_test.dart test/episode_card_test.dart test/title_trailer_test.dart test/trailer_button_test.dart test/live_pipeline_test.dart test/tv_layout_preview_test.dart test/recent_live_channels_test.dart test/history_episode_label_test.dart test/live_channel_picker_test.dart test/home_layout_preferences_test.dart test/home_customization_remote_test.dart test/player_remote_seek_test.dart test/subtitles_test.dart test/movie_hash_test.dart test/history_progress_policy_test.dart test/detail_remaining_remote_test.dart test/subtitle_overlay_sync_test.dart test/tv_scrub_multiplier_test.dart test/tv_filter_panel_test.dart test/tv_catalog_path_test.dart test/tv_catalog_controls_test.dart test/live_main_menu_test.dart test/app_migration_test.dart test/episode_image_url_test.dart test/catalog_index_builder_test.dart test/tv_home_rows_stress_test.dart test/frame_telemetry_test.dart test/catalog_sort_background_test.dart

      - name: Build APK (Release)
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dorg.gradle.parallel=true
        run: |
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION="$VERSION"
          df -h /

      - name: Verify native live window
        working-directory: android
        run: ./gradlew :video_player_android:testReleaseUnitTest --tests 'io.flutter.plugins.videoplayer.VideoPlayerTest.frameHealthDoesNotConfuseDimensionsWithRenderedVideo' --tests 'io.flutter.plugins.videoplayer.VideoPlayerTest.liveSeekClampsToCurrentWindow' --tests 'io.flutter.plugins.videoplayer.VideoPlayerTest.unseekableLiveDoesNotSeek' --tests 'io.flutter.plugins.videoplayer.VideoPlayerTest.liveDefaultPositionUsesNativeDefault'

      - name: Prepara APK per Release
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/StellarTV-v${{ env.VERSION }}.apk"

      - name: Carica Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: "StellarTV-v${{ env.VERSION }}"
          path: dist/*.apk
          retention-days: 14

      - name: Crea GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "StellarTV v${{ env.VERSION }}"
          body_path: RELEASE_NOTES.md
          files: dist/*.apk
          draft: false
          prerelease: false

      - name: Pubblica su StellarTV-releases (pubblica)
        if: ${{ env.RELEASE_TOKEN != '' }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ilBatta93/StellarTV-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: "v${{ env.VERSION }}"
          name: "StellarTV v${{ env.VERSION }}"
          body_path: RELEASE_NOTES.md
          files: dist/*.apk
          draft: false
          prerelease: false

      - name: Tieni solo l'ultima release pubblica
        if: ${{ env.RELEASE_TOKEN != '' }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -e
          REPO=ilBatta93/StellarTV-releases
          gh release list --repo "$REPO" --limit 200 --json tagName -q '.[].tagName' | while read -r TAG; do
            if [ "$TAG" != "v$VERSION" ]; then
              gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true
            fi
          done
