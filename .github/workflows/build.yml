name: StellarTV Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Libera spazio sul disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google \
            /usr/lib/jvm/temurin-8* /usr/lib/jvm/temurin-11* || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter packages
        run: |
          set -e
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          rm -f ios/Runner/GeneratedPluginRegistrant.h ios/Runner/GeneratedPluginRegistrant.m
          flutter pub get

      - name: Build APK (Release)
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          flutter build apk --release \
            --build-name="3.0.${{ github.run_number }}" \
            --build-number=${{ github.run_number }}
          df -h /

      - name: Prepara APK per Release
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/StellarTV-v3.0.${{ github.run_number }}.apk"

      - name: Carica Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: "StellarTV-v3.0.${{ github.run_number }}"
          path: dist/*.apk
          retention-days: 14

      - name: Crea GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v3.0.${{ github.run_number }}"
          name: "StellarTV v3.0.${{ github.run_number }}"
          body: |
            ### StellarTV v3.0.${{ github.run_number }}
            Compilazione automatica dal commit `${{ github.sha }}`.

            **Note di rilascio:**
            ${{ github.event.head_commit.message }}
          files: dist/*.apk
          draft: false
          prerelease: false
