name: StellarTV Verifica (senza rilascio)

# Solo controlli: analisi, formattazione, script di policy e test.
# Non compila APK e non pubblica nulla.
on:
  workflow_dispatch:
  push:
    branches: [audit/full-review]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analisi e test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Chiave di firma (solo controllo, non firma nulla)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error title=Firma::Secret mancante: $v"; exit 1; fi
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/k.jks"
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/k.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep 'SHA256:' | awk '{print $2}')
          rm -f "$RUNNER_TEMP/k.jks"
          echo "::notice title=Firma::Chiave valida, impronta SHA-256 ${FP}"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter packages
        run: |
          set -e
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          rm -f ios/Runner/GeneratedPluginRegistrant.h ios/Runner/GeneratedPluginRegistrant.m
          flutter --version
          flutter pub get

      - name: Analisi statica
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos lib test 2>&1 | tee analyze.txt

      - name: Formattazione
        id: format
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test 2>&1 | tee format.txt

      - name: Script di policy (tutti e 9)
        id: checks
        continue-on-error: true
        run: |
          FAIL=0
          for f in test/*_check.dart; do
            if dart run "$f" > /tmp/check.log 2>&1; then
              echo "OK    $f" | tee -a checks.txt
            else
              echo "FAIL  $f" | tee -a checks.txt
              tail -20 /tmp/check.log | tee -a checks.txt
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Test Dart
        id: tests
        continue-on-error: true
        run: flutter test --reporter expanded 2>&1 | tee tests.txt

      - name: Riepilogo
        if: always()
        run: |
          {
            echo "## Esito verifica"
            echo "| Controllo | Esito |"
            echo "|---|---|"
            echo "| Analisi statica | ${{ steps.analyze.outcome }} |"
            echo "| Formattazione | ${{ steps.format.outcome }} |"
            echo "| Script di policy | ${{ steps.checks.outcome }} |"
            echo "| Test Dart | ${{ steps.tests.outcome }} |"
            echo
            echo "### Analisi (ultime righe)"
            echo '```'
            tail -40 analyze.txt 2>/dev/null
            echo '```'
            echo "### Script di policy"
            echo '```'
            cat checks.txt 2>/dev/null
            echo '```'
            echo "### Test (ultime righe)"
            echo '```'
            tail -15 tests.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotazioni leggibili via API
        if: always()
        run: |
          # Ogni rapporto diventa un'annotazione (leggibile anche senza scaricare i log).
          note() {
            local title="$1" file="$2" lines="$3"
            [ -f "$file" ] || return 0
            local body
            body=$(tail -n "$lines" "$file" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
            echo "::notice title=${title}::${body}"
          }
          echo "::notice title=Esiti::analyze=${{ steps.analyze.outcome }} format=${{ steps.format.outcome }} checks=${{ steps.checks.outcome }} tests=${{ steps.tests.outcome }}"
          grep -E '^\s*(error|warning) ' analyze.txt | head -120 > analyze-issues.txt 2>/dev/null || true
          note "Analisi - riepilogo" analyze.txt 5
          note "Analisi - problemi (prime 120)" analyze-issues.txt 120
          note "Formattazione" format.txt 60
          note "Script di policy" checks.txt 150
          { tail -1 tests.txt; grep -E '\[E\]$' tests.txt | sed -E 's/^[0-9:]+ \+[0-9]+( ~[0-9]+)?( -[0-9]+)?: //' | sort -u | head -40; } > tests-short.txt 2>/dev/null || true
          note "Test" tests-short.txt 45
          { grep -cE '^\s*error ' analyze.txt; grep -cE '^\s*warning ' analyze.txt; grep -cE '^\s*info ' analyze.txt; } | paste -sd' ' | sed 's/^/errori avvisi info: /' > analyze-count.txt || true
          grep -E '^\s*info ' analyze.txt | sed -E 's/.* • ([a-z_]+)$/\1/' | sort | uniq -c | sort -rn | head -15 >> analyze-count.txt || true
          note "Analisi - conteggi" analyze-count.txt 20

      - name: Carica rapporti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifica-rapporti
          path: |
            analyze.txt
            format.txt
            checks.txt
            tests.txt
          retention-days: 7
