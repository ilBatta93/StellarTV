name: Keep database awake
# Supabase Free pauses a project after 7 days without traffic.
# The public key lives in the repository secret SUPABASE_ANON_KEY.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${ANON}" ]; then
            echo "Secret SUPABASE_ANON_KEY mancante"; exit 1
          fi
          curl -fsS -o /dev/null -w "%{http_code}\n" \
            -H "apikey: ${ANON}" \
            "https://dzojklhnwdjcrmkbepft.supabase.co/auth/v1/settings"
