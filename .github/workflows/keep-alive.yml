name: Keep database awake
# Supabase Free pauses a project after 7 days without traffic.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" \
            -H "apikey: ${ANON}" -H "Authorization: Bearer ${ANON}" \
            "https://dzojklhnwdjcrmkbepft.supabase.co/rest/v1/tmdb_ratings?select=key&limit=1"
        env:
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6b2prbGhud2RqY3Jta2JlcGZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NzU2ODgsImV4cCI6MjEwODA1MTY4OH0.OpZZ9_3QXlW6si8RaFKmKcKyjl74SWVTSdD1bgVYvYE
