name: stellar_tv
description: "StellarTV cross-platform multimedia player."
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.3
  cupertino_icons: ^1.0.8
  video_player: ^2.14.0
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.7
  supabase_flutter: ^2.8.3
  http: ^1.3.0
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  crypto: ^3.0.6
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  share_plus: ^11.1.0
  package_info_plus: ^8.3.0
  device_info_plus: ^11.5.0
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2

dependency_overrides:
  video_player_android:
    path: packages/video_player_android

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Sora.ttf
    - assets/fonts/Manrope.ttf
    - assets/branding/stellartv_logo.svg
    - assets/branding/stellartv_logo.png
    - assets/branding/stellartv_stella.png
    - assets/branding/stellartv_scritta.png
    - assets/branding/stellartv_stella.svg
    - assets/branding/stellartv_scritta.svg
    - assets/branding/stellar_space.jpg
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

